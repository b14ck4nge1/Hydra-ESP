name: Build ESP32-S3 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: "."
          command: |
            idf.py set-target esp32s3

            idf.py build

      - name: Show partition table
        run: |
          echo "=== partitions.csv ==="
          cat partitions.csv

      - name: Show flash command
        run: |
          echo "=== Flash args ==="
          cat build/flash_args || true

          echo "=== BIN files ==="
          find build -name "*.bin" -type f

      - name: Collect firmware
        run: |
          mkdir -p firmware

          cp build/bootloader/bootloader.bin firmware/
          cp build/partition_table/partition-table.bin firmware/

          find build -maxdepth 1 -name "*.bin" -exec cp {} firmware/ \;

          cp build/flash_args firmware/flash_args.txt || true
          cp build/flasher_args.json firmware/flasher_args.json || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-ESP32S3
          path: firmware/
