name: Build ESP32-S3 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ESP32-S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare ESP32-S3 config
        run: |
          echo 'CONFIG_IDF_TARGET="esp32s3"' >> sdkconfig.defaults
          echo 'CONFIG_PARTITION_TABLE_CUSTOM=y' >> sdkconfig.defaults
          echo 'CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"' >> sdkconfig.defaults
          echo 'CONFIG_PARTITION_TABLE_FILENAME="partitions.csv"' >> sdkconfig.defaults

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: "."
          command: |
            idf.py fullclean
            idf.py set-target esp32s3
            idf.py build

      - name: Show partition table
        if: always()
        run: |
          echo "=== Source partitions.csv ==="
          cat partitions.csv || true

          echo "=== Generated partition table ==="
          python /opt/esp/idf/components/partition_table/gen_esp32part.py \
            build/partition_table/partition-table.bin || true

      - name: Show generated files
        if: success()
        run: |
          echo "=== BIN files ==="
          find build -name "*.bin" -type f

          echo "=== Flash arguments ==="
          cat build/flash_args || true
          cat build/flasher_args.json || true

      - name: Collect firmware
        if: success()
        run: |
          mkdir -p firmware

          cp build/bootloader/bootloader.bin firmware/bootloader.bin
          cp build/partition_table/partition-table.bin firmware/partition-table.bin

          find build -maxdepth 1 -name "*.bin" -exec cp {} firmware/ \;

          cp build/flash_args firmware/flash_args.txt || true
          cp build/flasher_args.json firmware/flasher_args.json || true

      - name: Upload ESP32-S3 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: projecthydra-ESP32S3
          path: firmware/
